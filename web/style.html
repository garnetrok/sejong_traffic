<link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
        :root {
            --primary-color: #f5a623;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-color: #0b1320;
            --card-bg: #152238;
            --ai-color: #f5a623;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        body {
            font-family: 'Pretendard', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: transparent;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-color);
            padding: 0 30px;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-tabs {
            display: flex;
            padding-top: 15px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: var(--text-main);
        }

        .tab-btn.active {
            background-color: var(--card-bg);
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
        }

        .map-trigger-btn {
            background-color: var(--primary-color);
            color: #0b1320;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            padding: 20px 30px;
            flex: 1;
            overflow: hidden;
        }

        .control-panel {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 10px 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .filter-section {
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .filter-section:last-child {
            border-bottom: none;
        }

        h3 {
            margin-top: 0;
            font-size: 13px;
            color: var(--text-main);
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .date-range-label {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .checkbox-label:hover {
            color: var(--text-main);
        }

        .checkbox-label input {
            margin-right: 5px;
            width: 12px;
            height: 12px;
            accent-color: var(--primary-color);
        }

        select,
        input[type="date"] {
            width: 100%;
            padding: 4px 6px;
            background-color: #0f172a;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 12px;
            box-sizing: border-box;
            margin-bottom: 4px;
            outline: none;
            color-scheme: dark;
        }

        select:focus,
        input[type="date"]:focus {
            border-color: var(--primary-color);
        }

        .visual-panel {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        .chart-wrapper {
            flex: 1;
            position: relative;
            min-height: 220px;
        }

        .table-container {
            overflow-x: auto;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th,
        td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        th {
            background-color: #0f172a;
            color: var(--text-muted);
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        td {
            color: var(--text-main);
        }

        .status-select {
            padding: 4px;
            border-radius: 4px;
            font-size: 12px;
            background: #0f172a;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .sub-pipeline-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: #0f172a;
            padding: 8px;
            border-radius: 6px;
        }

        .sub-tab-btn {
            background: #1e293b;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .sub-tab-btn:hover {
            color: var(--text-main);
        }

        .sub-tab-btn.active {
            background: var(--primary-color);
            color: #0b1320;
            border-color: var(--primary-color);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .badge-raw {
            background: #1e293b;
            color: var(--text-muted);
        }

        .badge-pre {
            background: rgba(245, 166, 35, 0.2);
            color: var(--primary-color);
        }

        .badge-proc {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
        }

        .hidden {
            display: none !important;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
            gap: 20px;
            height: 100%;
        }

        .map-card {
            grid-column: 2;
            grid-row: 1 / span 2;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        /* Leaflet 커스텀 스타일 (다크모드) */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            padding: 5px;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .leaflet-popup-tip {
            background: var(--card-bg);
        }

        .leaflet-popup-content {
            font-family: 'Pretendard', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 10px;
            text-align: center;
        }

        .map-custom-label {
            background: rgba(11, 19, 32, 0.8);
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            box-shadow: none;
            font-weight: bold;
            color: var(--primary-color);
            padding: 2px 6px;
        }

        .ai-score-board {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            height: 100%;
        }

        .score-circle-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid var(--border-color);
            padding-right: 20px;
        }

        .ai-solution-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .upload-zone {
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            background-color: rgba(245, 166, 35, 0.05);
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            background-color: rgba(245, 166, 35, 0.15);
            border-color: #fcd34d;
        }

        .upload-icon {
            font-size: 36px;
            margin-bottom: 12px;
            color: var(--primary-color);
        }

        .score-display {
            font-size: 64px;
            font-weight: 800;
            color: var(--ai-color);
        }

        /* Scrollbar customization */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ---- 7월 이후 추가된 화면 요소 (원본 CSS 유실로 보충) ---- */
        .main-content { min-width: 0; }

        .chart-subtab-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .chart-subtab-btn {
            background: #1e293b; border: 1px solid var(--border-color); color: var(--text-muted);
            padding: 5px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer;
        }
        .chart-subtab-btn:hover { color: var(--text-main); }
        .chart-subtab-btn.active { background: var(--primary-color); color: #0b1320; border-color: var(--primary-color); }
        .chart-tab-wrapper { position: relative; flex: 1; min-height: 0; }

        .checkbox-group { display: flex; flex-wrap: wrap; gap: 2px 12px; }

        .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success-color); }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: var(--warning-color); }
        .badge-danger  { background: rgba(239, 68, 68, 0.2);  color: var(--danger-color); }
        .badge-info    { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }

        .score-desc { font-size: 13px; color: var(--text-muted); margin-top: 8px; text-align: center; }
        .ai-briefing-info { font-size: 13px; color: var(--text-muted); line-height: 1.6; white-space: pre-line; }

        @media (max-width: 1100px) {
            .container { grid-template-columns: 1fr; overflow: auto; }
            .dashboard-top-grid { grid-template-columns: 1fr !important; height: auto !important; }
        }
</style>
