# 하루 1번 ITS 실시간 데이터 수집 (Render 무료 서버는 잠들어 있으므로 먼저 깨운 뒤 요청)
name: ITS 일일 수집

on:
  schedule:
    - cron: "0 23 * * *"  # 매일 08:00 (한국 시간)
  workflow_dispatch:       # Actions 탭에서 수동 실행 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 서버 깨우기
        run: curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 https://sejong-traffic.onrender.com/health
      - name: 수집 요청
        # 재시도 없음: 서버는 이미 ITS를 호출했는데 응답만 늦은 경우 다시 부르면 호출 횟수 낭비
        run: |
          curl -fsS --max-time 170 -X POST \
            -H "X-Collect-Token: ${{ secrets.COLLECT_TOKEN }}" \
            https://sejong-traffic.onrender.com/collect
